# Galaxy Z Fold 7, NPU (1 HTP session), the profiler setup of profiler/configs/config_htp_1core_vit_*.json
PHONE_CTX=16384
PHONE_DEVICE=HTP0
# llama-server keeps a prompt cache in RAM (default up to 8192 MiB): it grew until the Flip6 rebooted.
# The profiler has no such cache, and each benchmark question is independent, so it stays off.
# --no-host as on the Flip6, so both phones run the same server flags
PHONE_EXTRA="--cache-ram 0 --no-host"
MODELS="qwen3vl_2b qwen35_0.8b qwen35_2b qwen2vl_2b qwen38_2b lfm25_1.6b qwen35_4b"
PUBLIC_LIMIT=50
SQA_LIMIT=100
# public512: mmmu_val again at max_new_tokens=512, as on the PC; gui: MMBench-GUI L1 subset (198)
STEPS="public sqa public512 gui"
