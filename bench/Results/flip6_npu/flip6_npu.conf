# Galaxy Z Flip6, NPU (1 HTP session), the profiler setup of profiler/configs/config_flip6_htp_1core_vit_*.json
# 8192 ctx with --no-host (checked on the Flip6: stable, about 2-3 GB free during the run)
PHONE_CTX=8192
PHONE_DEVICE=HTP0
# llama-server keeps a prompt cache in RAM (default up to 8192 MiB): it grew until the Flip6 rebooted.
# The profiler has no such cache, and each benchmark question is independent, so it stays off.
PHONE_EXTRA="--cache-ram 0 --no-host"
MODELS="qwen3vl_2b qwen35_0.8b qwen35_2b qwen2vl_2b qwen38_2b lfm25_1.6b"
PUBLIC_LIMIT=50
SQA_LIMIT=100
STEPS="public sqa gui"
